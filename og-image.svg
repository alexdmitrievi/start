<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1832"/>
      <stop offset="55%" stop-color="#1A2354"/>
      <stop offset="100%" stop-color="#0F1832"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="38%" r="55%">
      <stop offset="0%" stop-color="rgba(47,91,255,0.32)"/>
      <stop offset="70%" stop-color="rgba(47,91,255,0)"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="78%" cy="78%" r="40%">
      <stop offset="0%" stop-color="rgba(245,158,11,0.22)"/>
      <stop offset="70%" stop-color="rgba(245,158,11,0)"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#amberGlow)"/>

  <g transform="translate(80, 80)">
    <rect width="42" height="42" rx="12" fill="#2F5BFF"/>
    <path d="M 12 22 L 19 28 L 31 16" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="30" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="-0.5">Шанс Есть</text>
  </g>

  <g transform="translate(80, 200)">
    <rect width="240" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
    <circle cx="22" cy="18" r="4" fill="#FBBF24"/>
    <text x="38" y="24" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="14" fill="#C8D2FF">Бесплатно · 3 минуты</text>
  </g>

  <text x="80" y="310" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800" font-size="80" fill="#FFFFFF" letter-spacing="-2">Сложная ситуация —</text>
  <text x="80" y="400" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800" font-size="80" fill="#F59E0B" letter-spacing="-2">не приговор</text>

  <text x="80" y="475" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="26" fill="rgba(200,210,255,0.82)">До <tspan font-weight="700" fill="#FBBF24">350 000 ₽</tspan> от государства + запуск бизнеса с экспертом.</text>
  <text x="80" y="510" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="26" fill="rgba(200,210,255,0.82)">Помогаю даже с долгами, отказами и арестом счетов.</text>

  <g transform="translate(80, 555)">
    <rect width="200" height="36" rx="18" fill="rgba(47,91,255,0.18)" stroke="rgba(47,91,255,0.35)"/>
    <text x="20" y="24" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="13" fill="#A8BFFF">Социальный контракт</text>
    <rect x="216" width="200" height="36" rx="18" fill="rgba(245,158,11,0.14)" stroke="rgba(251,191,36,0.32)"/>
    <text x="236" y="24" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="13" fill="#FFD480">Запуск под ключ</text>
  </g>

  <g transform="translate(840, 120)">
    <rect x="-20" y="-20" width="320" height="190" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(245,158,11,0.30)" stroke-width="1.5"/>
    <text x="0" y="10" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="13" fill="#FFD480" letter-spacing="1">РЕАЛЬНЫЙ ПЛАТЁЖ</text>
    <text x="0" y="80" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800" font-size="56" fill="#22C55E" letter-spacing="-1">+349 794 ₽</text>
    <text x="0" y="115" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="14" fill="rgba(255,255,255,0.78)">МИНФИН ОМСКОЙ ОБЛАСТИ</text>
    <text x="0" y="140" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="13" fill="rgba(200,210,255,0.55)">07.05.2026 · по соц. контракту</text>
  </g>

  <g transform="translate(840, 380)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="13" fill="rgba(200,210,255,0.55)" letter-spacing="1">МАТЕМАТИКА ROI</text>
    <text x="0" y="40" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700" font-size="32" fill="#FFFFFF">350k ÷ 40k =</text>
    <text x="0" y="86" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800" font-size="48" fill="#FBBF24">×8.75</text>
    <text x="0" y="120" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="14" fill="rgba(200,210,255,0.72)">до первой выручки</text>
  </g>
